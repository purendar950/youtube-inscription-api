# Render Blueprint - Deploy for FREE at https://render.com
# This config deploys the YouTube Transcript API as a Web Service

services:
  - type: web
    name: youtube-transcript-api
    runtime: python
    region: oregon
    plan: free  # Free tier (spins down after 15 min of inactivity, wakes on request)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health
